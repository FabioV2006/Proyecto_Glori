services:
  - type: web
    name: glori-web
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: glori-db
          property: connectionString
      - key: GLORI_SECRET
        generateValue: true
      - key: GLORI_HTTPS
        value: "1"
      - key: GLORI_ADMIN_USERNAME
        value: admin
      - key: GLORI_ADMIN_PASSWORD
        sync: false
databases:
  - name: glori-db
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
